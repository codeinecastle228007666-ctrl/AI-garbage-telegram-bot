=========================================================================
  Интеграция Telegram-бота уведомлений с Open Server Panel (OSP)
=========================================================================

Проект: Z:\Users\yasuo\Desktop\agregate_notion

-------------------------------------------------------------------------
1. ЗАПУСК БОТА (через Меню программ OSP)
-------------------------------------------------------------------------

1. Открой папку OSP: %realprogdir%\progs\
   (обычно C:\OpenServer\progs\ или где установлен OSP)

2. Создай папку: TelegramBot
   Полный путь: %realprogdir%\progs\TelegramBot\

3. Создай внутри TelegramBot\ файл osinit.txt с текстом:
   Notification Bot

4. Создай в TelegramBot\ ярлык (shortcut) на start_bot.bat:
   - Нажми правой кнопкой -> Создать -> Ярлык
   - Объект: Z:\Users\yasuo\Desktop\agregate_notion\start_bot.bat
   - Назови: Запустить бота

5. Перезапусти OSP (трей -> Выход, затем Open Server.exe)

6. Теперь бот появится в меню OSP:
   Open Server -> Программы -> TelegramBot -> Запустить бота

-------------------------------------------------------------------------
2. ВЕБ-ПАНЕЛЬ УПРАВЛЕНИЯ (с кнопкой Вкл/Выкл)
-------------------------------------------------------------------------

Панель работает на http://localhost:8654

Запуск (1 раз): двойной клик по start_panel.bat
После запуска откроется браузер с кнопкой.

Чтобы панель запускалась вместе с OSP:

  Вариант А — Через Планировщик OSP:
    1. OSP -> Меню -> Настройки -> Планировщик
    2. Добавить задание:
       Время: * * * * * (каждую минуту — для автозапуска при старте OSP)
       Или просто оставь пустым для разового запуска
       Команда:
         "%realprogdir%\progs\TelegramBot\start_panel.bat"

  Вариант Б — Через Старт/Стоп скрипты OSP:
    1. OSP -> Меню -> Настройки -> Старт/Стоп скрипты
    2. В поле "Старт":
       python Z:\Users\yasuo\Desktop\agregate_notion\control_panel.py
    3. Теперь панель будет запускаться при старте OSP

  Вариант В — Через автозагрузку Windows:
    1. Win+R -> shell:startup
    2. Создать ярлык на start_panel.bat

-------------------------------------------------------------------------
3. ЗАКЛАДКА В OSP (быстрый доступ к панели)
-------------------------------------------------------------------------

1. OSP -> Меню -> Настройки -> Закладки
2. Добавить:
   - Тип: Ссылка
   - Имя: Bot Control
   - Ссылка: http://localhost:8654
3. Сохранить. Теперь в меню OSP появится пункт "Bot Control".

-------------------------------------------------------------------------
4. КОМАНДЫ ДЛЯ РУЧНОГО УПРАВЛЕНИЯ
-------------------------------------------------------------------------

Через PowerShell (от имени администратора):

  Статус:  .\bot_control.ps1 -Action status
  Старт:   .\bot_control.ps1 -Action start
  Стоп:    .\bot_control.ps1 -Action stop
  Тоггл:   .\bot_control.ps1 -Action toggle

Через командную строку:
  powershell -NoProfile -ExecutionPolicy Bypass -File bot_control.ps1 -Action status

-------------------------------------------------------------------------
5. ЧТО ГДЕ ЛЕЖИТ
-------------------------------------------------------------------------

  Файл                     Назначение
  ─────────────────────────────────────────────────────────────────
  main.py                  Бот (точка входа)
  control_panel.py         Веб-панель с кнопкой на http://localhost:8654
  bot_control.ps1          PowerShell-скрипт управления (start/stop/toggle)
  start_bot.bat            Запуск бота (с созданием .venv)
  start_panel.bat          Запуск веб-панели + открытие браузера
  osp_config.conf          Этот файл
  .env                     Токены и ID баз Notion
  .env.example             Пример .env
  services.py              Бизнес-логика на Notion API
  handlers.py              Обработчики команд
  notion_client.py         Notion API клиент
  notion_setup.py          Создание БД в Notion
  find_databases.py        Поиск БД в Notion
